- aid: bloomberg:bloomberg-blpapi-core
  name: Bloomberg BLPAPI Core
  description: >-
    The Bloomberg Open API (BLPAPI) Core — the foundational service-oriented, socket-based API used by
    the Desktop API, Server API (SAPI), B-PIPE, and Bloomberg Platform products. Provides Request/Response,
    Subscription, and Publishing paradigms across services including //blp/refdata, //blp/mktdata, //blp/mktbar,
    //blp/mktvwap, //blp/mktdepthdata, //blp/apiflds, //blp/instruments, //blp/pagedata, and //blp/tasvc.
